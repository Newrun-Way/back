# docker-compose.yml
volumes:
  hf_cache:
  st_cache:

services:
  # 서버(GPU)
  backend-gpu:
    profiles: ["gpu"]
    build: .
    container_name: back_gpu
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EMBEDDING_DEVICE: cuda
      HF_HOME: /opt/hf
      SENTENCE_TRANSFORMERS_HOME: /opt/st
    volumes:
      - ./app:/app/app
      - ./data:/app/app/data
      - hf_cache:/opt/hf
      - st_cache:/opt/st
    gpus: all # ← gpu전체사용
    restart: unless-stopped
