version: "3.9"

volumes:
  hf_cache:
  st_cache:
  redis_data:

services:
  # ======================================================
  # FastAPI (GPU)
  # ======================================================
  api:
    build:
      context: .
      target: api          # ← Multi-stage Dockerfile의 API 스테이지 선택
    container_name: back_api
    profiles: ["gpu"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      EMBEDDING_DEVICE: cuda
      HF_HOME: /opt/hf
      SENTENCE_TRANSFORMERS_HOME: /opt/st
      #셀러리 환경
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./app:/app/app
      - ./data:/app/app/data
      - hf_cache:/opt/hf
      - st_cache:/opt/st
    gpus: all
    depends_on:
      - redis
    restart: unless-stopped

  # ======================================================
  # Celery Worker (CPU)
  # ======================================================
  worker:
    build:
      context: .
      target: worker       # ← Multi-stage Dockerfile의 worker 스테이지 선택
    container_name: back_worker
    env_file:
      - .env
    environment:
      EMBEDDING_DEVICE: cpu    # Worker는 GPU 불필요
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./app:/app/app
      - ./data:/app/app/data
    depends_on:
      - redis
    restart: unless-stopped

  # ======================================================
  # Flower Dashboard (CPU)
  # ======================================================
  flower:
    build:
      context: .
      target: flower
    container_name: back_flower
    command: >
      celery 
      --broker=redis://redis:6379/0
      --result-backend=redis://redis:6379/1
      -A app.core.celery_app.celery_app 
      flower 
      --port=5555
      --persistent=True
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

  # ======================================================
  # Redis (Message Broker)
  # ======================================================
  redis:
    image: redis:7
    container_name: back_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
